services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ecila
      POSTGRES_USER: ecila
      POSTGRES_PASSWORD: change-me
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecila -d ecila"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["ecila_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ecila:change-me@postgres:5432/ecila
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      TASK_PROCESSING_MODE: queue
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["3000:3000"]
  task-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ecila:change-me@postgres:5432/ecila
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      TASK_PROCESSING_MODE: queue
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  document-worker:
    build:
      context: .
      dockerfile: python_worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://ecila:change-me@postgres:5432/ecila
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  ecila_pg:
